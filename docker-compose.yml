services:
  # Tailscale egress → MySQL on the tailnet. Apps use Docker DNS name mysql-tailscale.
  mysql-tailscale:
    image: tailscale/tailscale:stable
    container_name: mysql-tailscale
    hostname: ${TS_HOSTNAME:-tailscale-mysql-egress}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_HOSTNAME=${TS_HOSTNAME:-tailscale-mysql-egress}
      - TS_TAILNET_TARGET_FQDN=${TS_TAILNET_TARGET_FQDN}
      - TS_ENABLE_HEALTH_CHECK=true
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - macbackpackers-network
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Castle Rock Hostel
  crh-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crh-processor
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dhttps.protocols=TLSv1.2,TLSv1.3
      - SE_SCREEN_WIDTH=1920
      - SE_SCREEN_HEIGHT=1080
      - DISPLAY=:99
      - HOME=/home/appuser
      - SPRING_PROFILES_ACTIVE=crh
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-service-account.json
      - DB_HOST=mysql-tailscale
      - SHAREDDB_HOST=mysql-tailscale
    volumes:
      - ./logs/crh:/app/logs
      - ./chromeprofile/crh:/app/chromeprofile
      - ./config/crh:/app/config
      - ./credentials/crh_gmail:/app/credentials/gmail
      - ./credentials/gcp-service-account.json:/app/credentials/gcp-service-account.json
      - ./credentials/ssh/config:/home/appuser/.ssh/config
      - ./credentials/ssh/mediatemple.net_rsa:/home/appuser/.ssh/mediatemple.net_rsa
    networks:
      - macbackpackers-network
    depends_on:
      - mysql-tailscale
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    ulimits:
      nofile:
        soft: 32768
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep java || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # High Street Hostel
  hsh-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hsh-processor
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dhttps.protocols=TLSv1.2,TLSv1.3
      - SE_SCREEN_WIDTH=1920
      - SE_SCREEN_HEIGHT=1080
      - DISPLAY=:99
      - HOME=/home/appuser
      - SPRING_PROFILES_ACTIVE=hsh
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-service-account.json
      - DB_HOST=mysql-tailscale
      - SHAREDDB_HOST=mysql-tailscale
    volumes:
      - ./logs/hsh:/app/logs
      - ./chromeprofile/hsh:/app/chromeprofile
      - ./config/hsh:/app/config
      - ./credentials/hsh_gmail:/app/credentials/gmail
      - ./credentials/gcp-service-account.json:/app/credentials/gcp-service-account.json
      - ./credentials/ssh/config:/home/appuser/.ssh/config
      - ./credentials/ssh/mediatemple.net_rsa:/home/appuser/.ssh/mediatemple.net_rsa
    networks:
      - macbackpackers-network
    depends_on:
      - mysql-tailscale
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    ulimits:
      nofile:
        soft: 32768
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep java || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Royal Mile Backpackers
  rmb-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rmb-processor
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dhttps.protocols=TLSv1.2,TLSv1.3
      - SE_SCREEN_WIDTH=1920
      - SE_SCREEN_HEIGHT=1080
      - DISPLAY=:99
      - HOME=/home/appuser
      - SPRING_PROFILES_ACTIVE=rmb
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-service-account.json
      - DB_HOST=mysql-tailscale
      - SHAREDDB_HOST=mysql-tailscale
    volumes:
      - ./logs/rmb:/app/logs
      - ./chromeprofile/rmb:/app/chromeprofile
      - ./config/rmb:/app/config
      - ./credentials/rmb_gmail:/app/credentials/gmail
      - ./credentials/gcp-service-account.json:/app/credentials/gcp-service-account.json
      - ./credentials/ssh/config:/home/appuser/.ssh/config
      - ./credentials/ssh/mediatemple.net_rsa:/home/appuser/.ssh/mediatemple.net_rsa
    networks:
      - macbackpackers-network
    depends_on:
      - mysql-tailscale
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    ulimits:
      nofile:
        soft: 32768
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep java || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Lochside Hostel
  lsh-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lsh-processor
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dhttps.protocols=TLSv1.2,TLSv1.3
      - SE_SCREEN_WIDTH=1920
      - SE_SCREEN_HEIGHT=1080
      - DISPLAY=:99
      - HOME=/home/appuser
      - SPRING_PROFILES_ACTIVE=lsh
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-service-account.json
      - DB_HOST=mysql-tailscale
      - SHAREDDB_HOST=mysql-tailscale
    volumes:
      - ./logs/lsh:/app/logs
      - ./chromeprofile/lsh:/app/chromeprofile
      - ./config/lsh:/app/config
      - ./credentials/lsh_gmail:/app/credentials/gmail
      - ./credentials/gcp-service-account.json:/app/credentials/gcp-service-account.json
      - ./credentials/ssh/config:/home/appuser/.ssh/config
      - ./credentials/ssh/mediatemple.net_rsa:/home/appuser/.ssh/mediatemple.net_rsa
    networks:
      - macbackpackers-network
    depends_on:
      - mysql-tailscale
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    ulimits:
      nofile:
        soft: 32768
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep java || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Live Cloudbeds reads for ronbot (reuses lilhotelier.jar + CloudbedsScraper)
  ronbot-read-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ronbot-read-api
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      - "${RONBOT_READ_API_PORT:-8080}:8080"
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djava.net.preferIPv4Stack=true
      - HOME=/home/appuser
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-service-account.json
      - SERVER_PORT=8080
      - RONBOT_TOKEN=${RONBOT_TOKEN:-}
      - ronbot.token=${RONBOT_TOKEN:-}
      - ronbot.properties=${RONBOT_PROPERTIES:-crh,hsh,rmb,lsh}
      - DB_HOST=mysql-tailscale
      - SHAREDDB_HOST=mysql-tailscale
    volumes:
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./credentials/gcp-service-account.json:/app/credentials/gcp-service-account.json:ro
      - ./logs/crh:/app/logs/crh
      - ./logs/hsh:/app/logs/hsh
      - ./logs/rmb:/app/logs/rmb
      - ./logs/lsh:/app/logs/lsh
      # HtmlUnit only — no Chrome profile mounts (processors own those)
      - ./config/crh:/app/config/crh
      - ./config/hsh:/app/config/hsh
      - ./config/rmb:/app/config/rmb
      - ./config/lsh:/app/config/lsh
    networks:
      - macbackpackers-network
    depends_on:
      - mysql-tailscale
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/ronbot/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    command:
      - sh
      - -c
      - exec java -server $$JAVA_OPTS -Dloader.main=com.macbackpackers.ronbot.RunRonbotReadApi -jar lilhotelier.jar

  # Unofficial WhatsApp Web gateway (burner SIM via QR). See ronbot-bridge/README.md.
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    ports:
      - "${WAHA_PORT:-3000}:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=${WAHA_ENGINE:-NOWEB}
      - WHATSAPP_HOOK_URL=http://ronbot-bridge:8787/webhooks/waha
      - WHATSAPP_HOOK_EVENTS=message,group.v2.participants
      - WHATSAPP_RESTART_ALL_SESSIONS=True
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-admin}
      - WAHA_NO_API_KEY=${WAHA_NO_API_KEY:-False}
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - macbackpackers-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # WhatsApp → Cursor SDK + ronbot-ops MCP bridge
  ronbot-bridge:
    build:
      context: .
      dockerfile: ronbot-bridge/Dockerfile
    container_name: ronbot-bridge
    restart: unless-stopped
    ports:
      - "8787:8787"
    # Leave Docker embedded DNS (127.0.0.11) intact for service names.
    # Entrypoint (FIX_CONTAINER_DNS) adds public fallbacks + pins api.cursor.com via DoH.
    environment:
      - PORT=8787
      - FIX_CONTAINER_DNS=1
      - PIN_CURSOR_API_DNS=1
      - WAHA_BASE_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - RONBOT_WHATSAPP_GROUPS=${RONBOT_WHATSAPP_GROUPS:-}
      - RONBOT_MENTION=${RONBOT_MENTION:-@ronbot}
      - RONBOT_FOLLOWUP_MINUTES=${RONBOT_FOLLOWUP_MINUTES:-15}
      - CURSOR_API_KEY=${CURSOR_API_KEY:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-service-account.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-macbackpackers-backoffice}
      - RONBOT_READ_API_URL=http://ronbot-read-api:8080
      - RONBOT_TOKEN=${RONBOT_TOKEN:-}
      - RONBOT_MCP_ENTRY=/app/ronbot-mcp/dist/index.js
      - REPO_ROOT=/app/repo
      - LOG_DIR_CRH=/logs/crh
      - LOG_DIR_HSH=/logs/hsh
      - LOG_DIR_RMB=/logs/rmb
      - LOG_DIR_LSH=/logs/lsh
      - HOME=/home/node
      # MCP run_sql / describe_sql_tables (read-only MySQL user); hidden when user/password empty
      - RONBOT_SQL_RO_HOST=mysql-tailscale
      - RONBOT_SQL_RO_USER=${RONBOT_SQL_RO_USER:-}
      - RONBOT_SQL_RO_PASSWORD=${RONBOT_SQL_RO_PASSWORD:-}
    volumes:
      - ./credentials/gcp-service-account.json:/app/credentials/gcp-service-account.json:ro
      # MCP dist + node_modules are baked into the image (do not mount host dist —
      # an empty/root-owned ./ronbot-mcp/dist would hide the baked build).
      # Config stays bind-mounted for allowlist/properties edits without rebuild.
      - ./ronbot-mcp/config:/app/ronbot-mcp/config:ro
      # RW: Cursor local agent needs writable cwd/state (SQLite under HOME / workspace)
      - .:/app/repo
      - ./logs/crh:/logs/crh:ro
      - ./logs/hsh:/logs/hsh:ro
      - ./logs/rmb:/logs/rmb:ro
      - ./logs/lsh:/logs/lsh:ro
      - ./ronbot-bridge/config:/app/bridge/config:ro
      - ronbot_bridge_home:/home/node
    networks:
      - macbackpackers-network
    depends_on:
      - waha
      - ronbot-read-api
      - mysql-tailscale
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  mysql_data:
    driver: local
  tailscale_state:
    driver: local
  waha_sessions:
    driver: local
  ronbot_bridge_home:
    driver: local

networks:
  macbackpackers-network:
    driver: bridge
