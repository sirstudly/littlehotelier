chromescraper.driver.options=user-data-dir=/app/chromeprofile --headless=new --disable-gpu --start-maximized --ignore-certificate-errors --disable-dev-shm-usage --no-sandbox --remote-allow-origins=* --crash-dumps-dir=/tmp/chrome-crash
# Headed-looking UA (do not put this on chromescraper.driver.options; that property is split on spaces).
chromescraper.driver.useragent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36
chromescraper.maxwait.seconds=660
# Set true (or -Dwebdriver.chrome.verboseLogging=true) to write logs/chromedriver.log
chromescraper.driver.verbose=false

# interval in which to check for new jobs
processor.repeat.interval.ms=60000
# number of worker threads
processor.thread.count=6

# number of retries before job marked as failed
process.jobs.retries=3

# time to wait before re-attempting failed job
process.jobs.backoff.millis=3000

# local job log directory
processor.job.log.localdir=/app/logs

# Reference secrets from Google Secret Manager
spring.config.import=sm@
# JDBC host via shareddb.host / db.host (Compose: SHAREDDB_HOST / DB_HOST=mysql-tailscale)
shareddb.url=jdbc:mysql://${shareddb.host:${db.host:mysql-tailscale}}:3306/scotlandstophostels?socketTimeout=600000
shareddb.username=${sm@shareddb_username}
shareddb.password=${sm@shareddb_password}
shareddb.poolsize.min=1
shareddb.poolsize.max=1

db.driverclass=com.mysql.cj.jdbc.Driver

# HikariCP: maxLifetime in seconds (0 → DatabaseConfig uses 10 minutes).
# Connections older than this are retired from the pool.
db.maxidletime=0

# HikariCP: idle connection keepalive interval in seconds (DatabaseConfig enforces >= 30s).
# Pings idle pooled connections so Tailscale/MySQL do not silently close them.
# Should be less than MySQL wait_timeout.
db.idle.connection.test.period=10

# HikariCP: idleTimeout in seconds for connections above minimumIdle.
# Release excess connections after a usage spike.
db.max.idle.time.excess.connections=60

# Google Cloud configuration
spring.cloud.gcp.secretmanager.enabled=true
spring.cloud.gcp.secretmanager.allow-default-secret=false
spring.cloud.gcp.project-id=macbackpackers-backoffice

# this needs to be set as an environment variable under GOOGLE_APPLICATION_CREDENTIALS
#spring.cloud.gcp.credentials.location=file:/Volumes/DATA/credentials/gcp-service-account.json
spring.cloud.gcp.secretmanager.project-id=macbackpackers-backoffice

logging.level.com.google.cloud.spring.secretmanager=DEBUG
logging.level.com.google.cloud.spring.core=DEBUG
logging.level.org.springframework.cloud.gcp=DEBUG
#logging.level.org.springframework=DEBUG

# I/O Thread Pool configuration for parallel HTTP operations
io.thread.pool.size=8

# Edinburgh Visitor Levy
evl.enabled=false
evl.stay.date.from=2026-07-24
