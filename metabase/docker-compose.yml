# Metabase UI — app DB + warehouse on MariaDB.
# Deploy from this directory (separate Compose project from littlehotelier).
#
# Requires on MariaDB first:
#   src/main/config/migrations/2026-11-12-mac-analytics.sql (+ CREATE USER grants)
#
# Copy .env.example → .env and fill credentials / Tailscale bind.

services:
  metabase:
    image: metabase/metabase:v0.55.9
    container_name: metabase
    restart: unless-stopped
    ports:
      # Bind to Tailscale IP only (set METABASE_BIND in .env).
      - "${METABASE_BIND:-127.0.0.1}:${METABASE_PORT:-3002}:3000"
    environment:
      MB_DB_TYPE: mysql
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 3306
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
      # Set in .env (Tailscale IP of MariaDB if MagicDNS does not resolve).
      MB_DB_HOST: ${MB_DB_HOST}
      JAVA_TIMEZONE: Europe/London
    volumes:
      - metabase_data:/metabase-data
    networks:
      - metabase-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  metabase-net:
    driver: bridge

volumes:
  metabase_data:
